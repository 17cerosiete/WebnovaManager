<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebNova Manager - Admin Login</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    
    .login-card {
      background: white;
      padding: 3rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-header h1 {
      color: #2563eb;
      margin-bottom: 0.5rem;
    }
    
    .login-header p {
      color: #6b7280;
      font-size: 0.875rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #1f2937;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: all 250ms;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    
    .remember-me input {
      width: auto;
      cursor: pointer;
    }
    
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 250ms;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    
    .alert {
      margin-bottom: 1.5rem;
    }
    
    .demo-info {
      margin-top: 2rem;
      padding: 1rem;
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      border-radius: 0.5rem;
      font-size: 0.875rem;
    }
    
    .demo-info strong {
      display: block;
      margin-bottom: 0.5rem;
      color: #0c4a6e;
    }
    
    .demo-info code {
      background: white;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>📊 WebNova Manager</h1>
        <p>Sistema de Gestión de Contenidos</p>
      </div>
      
      <div id="alert"></div>
      
      <form id="loginForm" method="POST" action="../auth/login.php">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="admin@webnova.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember" style="margin: 0;">Recuérdame</label>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>
      
      <div class="demo-info">
        <strong>🔓 Credenciales de demo:</strong>
        Email: <code>admin@webnova.com</code><br>
        Contraseña: <code>0000</code>
      </div>
    </div>
  </div>
  
  <script>
    // Verificar si ya hay sesión PHP en servidor
    // Esto se hará en middleware/auth.php (próximo paso)
    // Por ahora, solo manejamos el formulario

    // Si esta página se abrió desde file://, avisar al usuario
    if (window.location.protocol === 'file:') {
      document.getElementById('alert').innerHTML = '<div class="alert alert-danger">✗ Abre esta página desde el servidor: <code>http://localhost/WebnovaManager/admin/index.html</code></div>';
    }

    // Manejar login con AJAX
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Evitar reload de página

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertDiv = document.getElementById('alert');
      const btn = document.querySelector('.btn-login');

      // Mostrar loading
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      // Hacer POST a auth/login.php
      fetch('../auth/login.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        credentials: 'include',  // ⚠️ Importante: Incluir cookies de sesión
        body: 'email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password)
      })
      .then(async response => {
        const text = await response.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch (error) {
          throw new Error('Respuesta inesperada del servidor: ' + text);
        }

        if (data.success) {
          alertDiv.innerHTML = '<div class="alert alert-success">✓ Acceso concedido. Redirigiendo...</div>';
          setTimeout(() => {
            window.location.href = 'dashboard.php';
          }, 800);
        } else {
          alertDiv.innerHTML = '<div class="alert alert-danger">✗ ' + (data.error || 'Error al iniciar sesión') + '</div>';
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
          document.getElementById('password').value = '';
        }
      })
      .catch(error => {
        alertDiv.innerHTML = '<div class="alert alert-danger">✗ ' + error.message + '</div>';
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
        console.error('Error:', error);
      });
    });
  </script>
</body>
</html>
